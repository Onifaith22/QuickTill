name: Docker Image Build and Push

# Reusable: the CD workflow calls this after CI passes, so images are only built from commits
# CI has tested, and publishing happens in one place.
# Each image keeps the tag Azure was set up with (backend: latest, frontend: v2) and also gets
# the short commit SHA. CD deploys the SHA tag, so a rollback can return to an exact build.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (the one CI tested)
        required: true
        type: string
    outputs:
      tag:
        description: Short commit SHA the images were tagged with
        value: ${{ jobs.build-and-push.outputs.tag }}

permissions:
  contents: read

env:
  # Public on purpose: Azure pulls from this account, and the logs show the full image name
  IMAGE_NAMESPACE: onifaith22
  PROD_API_URL: https://app-quicktill-ioprww.azurewebsites.net

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set image tag (short commit SHA)
        id: tag
        run: |
          TAG=$(git rev-parse --short=7 HEAD)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # DOCKERHUB_USERNAME is a repository variable, the token is a secret
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # APP_VERSION makes /version report this tag, so we can prove which build is live
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/quicktill-backend:latest
            ${{ env.IMAGE_NAMESPACE }}/quicktill-backend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # The production backend hostname never changes during a slot swap.
      # APP_VERSION is written to /version.txt for the same reason as the backend.
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ env.PROD_API_URL }}
            APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/quicktill-frontend:v2
            ${{ env.IMAGE_NAMESPACE }}/quicktill-frontend:latest
            ${{ env.IMAGE_NAMESPACE }}/quicktill-frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Images pushed
        run: |
          {
            echo "- \`$IMAGE_NAMESPACE/quicktill-backend\`: latest, ${{ steps.tag.outputs.tag }}"
            echo "- \`$IMAGE_NAMESPACE/quicktill-frontend\`: v2, latest, ${{ steps.tag.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
